name: Atualizar mídias sociais

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-social-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update social media data
        run: npm run update:social
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_ACCESS_TOKEN: ${{ secrets.IG_GRAPH_ACCESS_TOKEN }}

      - name: Validate
        run: |
          npm run lint
          npm run build

      - name: Detect updates
        id: updates
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No social media updates."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updates
        if: steps.updates.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/socialMedia.json public/social
          git commit -m "Atualiza mídias sociais"
          git push

      - name: Deploy to Vercel
        if: steps.updates.outputs.changed == 'true'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not configured. Skipping CLI deploy; Vercel Git integration may still deploy the commit."
            exit 0
          fi

          if [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "VERCEL_PROJECT_ID or VERCEL_ORG_ID not configured. Skipping CLI deploy."
            exit 0
          fi

          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npx vercel --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
